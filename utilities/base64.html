    /* Theme boot: apply a saved choice before CSS paints (no flash); otherwise CSS follows the system. */
    (function () {
      var d = document.documentElement, t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t === 'dark-mode' || t === 'light-mode') { d.classList.add(t); d.setAttribute('data-theme', t === 'dark-mode' ? 'dark' : 'light'); }
      else { d.setAttribute('data-theme', window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
    })();

        * {

        body {

            gap: 10px;

        .btn {

            font-size: 0.9rem;
            font-weight: 500;

            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            color: #5a6c7d;
            border: 1px solid #dce1e5;

        .btn:hover {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        .btn:active {

        }

        .btn-primary {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        .btn-primary:hover {

        }

        .btn-secondary {
            background: #ecf0f1;
            color: #5a6c7d;

            border-color: #cbd3d9;
            color: #5a6c7d;

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

            position: absolute;
            left: -9999px;

        .preview {

        .preview h4 {

        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;

        /* Always in the accessibility tree; visually hidden */
        .status-live {
            position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
            overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
        }

        footer {
            text-align: center;
            color: #95a5a6;
            margin-top: 40px;
            font-size: 0.9rem;

        @media (max-width: 768px) {

        }

        @media (max-width: 480px) {
            .container {

                padding: 20px;
            }

            header h1 {
                font-size: 1.6rem;

            .tool-card {

            }

                font-size: 0.9rem;
            }

            .button-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    <div class="container" id="main" tabindex="-1">
        
        <header>
            <h1>Base64 Encoder / Decoder</h1>
            <p>Convert text and files to/from Base64</p>
        </header>

        <div class="tool-card">
            <div class="dual-pane">
                <div class="pane">
                    <label for="textInput">
                        <span>Original Text</span>
                        <span class="char-count" id="textCount">0 chars</span>
                    </label>
                    <textarea
                        id="textInput"
                        placeholder="Enter original text here..."
                    ></textarea>
                </div>

                <div class="pane">
                    <label for="base64Input">
                        <span>Base64</span>
                        <span class="char-count" id="base64Count">0 chars</span>
                    </label>
                    <textarea
                        id="base64Input"
                        placeholder="Enter Base64 here..."
                    ></textarea>
                </div>
            </div>

            <div class="controls">
                <div class="button-row">
                    <button class="btn btn-primary" onclick="encodeText()">Encode →</button>
                    <button class="btn btn-primary" onclick="decodeText()">← Decode</button>
                    <label class="checkbox-label">
                        <input type="checkbox" id="urlSafe">
                        URL-safe
                    </label>
                </div>

                <div class="button-row">
                    <div class="file-input-wrapper">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">Encode File</button>
                        <input type="file" id="fileInput" tabindex="-1" aria-hidden="true" onchange="encodeFile(event)">
                    </div>
                    <button class="btn btn-secondary" onclick="downloadAsFile()">Download Decoded File</button>
                    <button class="btn btn-success" onclick="copyBase64()">Copy Base64</button>
                    <button class="btn btn-success" onclick="copyText()">Copy Text</button>
                </div>

                <div class="message" id="message" aria-hidden="true"></div>
                <div class="status-live" id="status" role="status" aria-live="polite" aria-atomic="true"></div>
            </div>

            <div class="preview" id="preview">
                <h4>Image Preview</h4>
                <img id="previewImage" alt="Preview">
            </div>
        </div>

        <footer>
            <p>Note: All operations run locally in your browser. Nothing is uploaded.</p>
        </footer>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const base64Input = document.getElementById('base64Input');
        const textCount = document.getElementById('textCount');
        const base64Count = document.getElementById('base64Count');
        const message = document.getElementById('message');
        const preview = document.getElementById('preview');
        const previewImage = document.getElementById('previewImage');
        const urlSafe = document.getElementById('urlSafe');

        // Update counters
        function updateTextCount() {
            textCount.textContent = `${textInput.value.length} chars`;
        }

        function updateBase64Count() {
            base64Count.textContent = `${base64Input.value.length} chars`;
        }

        textInput.addEventListener('input', updateTextCount);
        base64Input.addEventListener('input', updateBase64Count);

        // Show message
        const status = document.getElementById('status');
        let hideTimer, statusTimer;
        function showMessage(msg, type = 'info') {
            message.className = `message ${type}`;
            message.textContent = msg;

            // Screen readers: the status region is always exposed; clear, then set, so repeats are announced too
            clearTimeout(statusTimer);
            status.textContent = '';
            statusTimer = setTimeout(() => { status.textContent = msg; }, 50);

            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                message.className = 'message';
            }, 3000);
        }

        // URL-safe Base64 (and missing padding) → standard Base64
        function toStandardBase64(b64) {
            b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) {
                b64 += '=';
            }
            return b64;
        }

        function toUrlSafeBase64(b64) {
            return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        // Encode text → Base64
        function encodeText() {
            const text = textInput.value;
            if (!text) {
                showMessage('Please enter text to encode', 'error');
                return;
            }

            try {
                let encoded = btoa(unescape(encodeURIComponent(text)));

                if (urlSafe.checked) {
                    encoded = toUrlSafeBase64(encoded);
                }

                base64Input.value = encoded;
                updateBase64Count();
                showMessage('Encoded successfully', 'success');
                checkForImage(encoded);
            } catch (e) {
                showMessage(`Encode failed: ${e.message}` , 'error');
            }
        }

        // Decode Base64 → text
        function decodeText() {
            let text = base64Input.value.trim();
            if (!text) {
                showMessage('Please enter Base64 to decode', 'error');
                return;
            }

            try {
                // Handle URL-safe Base64
                text = text.replace(/-/g, '+').replace(/_/g, '/');

                // Pad to multiple of 4
                while (text.length % 4) {
                    text += '=';
                }

                const decoded = decodeURIComponent(escape(atob(text)));
                textInput.value = decoded;
                updateTextCount();
                showMessage('Decoded successfully', 'success');
                checkForImage(text);
            } catch (e) {
                showMessage(`Decode failed: ${e.message}`, 'error');
            }
        }

        // Encode file → Base64
        function encodeFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let base64 = e.target.result.split(',')[1];
                if (urlSafe.checked) {
                    base64 = toUrlSafeBase64(base64);
                }
                base64Input.value = base64;
                updateBase64Count();
                showMessage(`File "${file.name}" encoded`, 'success');
                checkForImage(base64);
            };
            reader.onerror = function() {
                showMessage('Failed to read file', 'error');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // Detect image data and preview it
        function checkForImage(base64) {
            base64 = toStandardBase64(base64);
            const imageFormats = [
                { prefix: '/9j/', mime: 'jpeg' },
                { prefix: 'iVBORw0KGgo', mime: 'png' },
                { prefix: 'R0lGOD', mime: 'gif' },
                { prefix: 'UklGR', mime: 'webp' }
            ];

            for (const format of imageFormats) {
                if (base64.startsWith(format.prefix)) {
                    previewImage.src = `data:image/${format.mime};base64,${base64}`;
                    preview.classList.add('show');
                    return;
                }
            }
            preview.classList.remove('show');
        }

        // Download decoded file
        function downloadAsFile() {
            let base64 = base64Input.value.trim();
            if (!base64) {
                showMessage('Please enter Base64', 'error');
                return;
            }

            // Handle URL-safe Base64 and missing padding, as in decodeText()
            base64 = base64.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) {
                base64 += '=';
            }

            try {
                // Try to detect file type by signature
                let mimeType = 'application/octet-stream';
                let extension = 'bin';

                if (base64.startsWith('/9j/')) {
                    mimeType = 'image/jpeg';
                    extension = 'jpg';
                } else if (base64.startsWith('iVBORw0KGgo')) {
                    mimeType = 'image/png';
                    extension = 'png';
                } else if (base64.startsWith('R0lGOD')) {
                    mimeType = 'image/gif';
                    extension = 'gif';
                } else if (base64.startsWith('UklGR')) {
                    mimeType = 'image/webp';
                    extension = 'webp';
                } else if (base64.startsWith('JVBERi0')) {
                    mimeType = 'application/pdf';
                    extension = 'pdf';
                }

                const byteCharacters = atob(base64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: mimeType });

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `decoded_file.${extension}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showMessage('File downloaded', 'success');
            } catch (e) {
                showMessage(`Download failed: ${e.message}`, 'error');
            }
        }

        // Copy Base64
        async function copyBase64() {
            const text = base64Input.value;
            if (!text) {
                showMessage('Nothing to copy', 'error');
                return;
            }

            try {
                await navigator.clipboard.writeText(text);
                showMessage('Copied to clipboard', 'success');
            } catch (err) {
                base64Input.select();
                document.execCommand('copy');
                showMessage('Copied to clipboard', 'success');
            }
        }

        // Copy text
        async function copyText() {
            const text = textInput.value;
            if (!text) {
                showMessage('Nothing to copy', 'error');
                return;
            }

            try {
                await navigator.clipboard.writeText(text);
                showMessage('Copied to clipboard', 'success');
            } catch (err) {
                textInput.select();
                document.execCommand('copy');
                showMessage('Copied to clipboard', 'success');
            }
        }

        // Initialize counters
        updateTextCount();
        updateBase64Count();
    </script>
